<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10191b"><title>Cycling Coach</title>
<style>
:root{--bg:#0d1416;--panel:#172225;--panel2:#202d30;--text:#f4f7f7;--muted:#a7b5b7;--orange:#f97316;--line:#304044}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:88px}.hero{padding:22px 18px 18px;background:linear-gradient(145deg,#182629,#10191b)}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:var(--orange);display:grid;place-items:center;font-size:25px}.sub{font-size:11px;letter-spacing:1.3px;color:var(--muted)}h1{font-size:25px;margin:19px 0 5px}p{color:var(--muted);line-height:1.5;margin:5px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:20px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font-size:22px;margin-top:3px}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr);background:#111b1d;border-top:1px solid var(--line);padding:7px 4px max(7px,env(safe-area-inset-bottom));z-index:3}.tabs button{background:none;border:0;color:var(--muted);font-size:11px;padding:7px 2px}.tabs button span{display:block;font-size:19px;margin-bottom:2px}.tabs button.active{color:var(--orange);font-weight:700}main{padding:18px;display:grid;gap:13px}h2{font-size:19px;margin:0 0 3px}.card h3{font-size:16px;margin:0 0 7px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--muted);font-size:13px}.pill{border-radius:99px;background:var(--panel2);padding:5px 9px;font-size:11px;color:#d7e0e1;white-space:nowrap}.primary,.secondary{border:0;border-radius:12px;padding:12px 15px;font-weight:650}.primary{background:var(--orange);color:#fff}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.full{width:100%;margin-top:12px}.day{padding:13px 0;border-bottom:1px solid var(--line)}.day:last-child{border:0}.day input[type=checkbox]{accent-color:var(--orange);width:19px;height:19px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:13px;color:var(--muted)}input,textarea,select{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#10191b;color:var(--text);outline-color:var(--orange)}textarea{resize:vertical}.choices{display:flex;flex-wrap:wrap;gap:8px}.choices button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}.choices button.selected{border-color:var(--orange);color:var(--orange)}.bar{height:9px;background:var(--panel2);border-radius:20px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--orange);width:0}.empty{text-align:center;padding:24px;color:var(--muted)}.warning{font-size:12px;color:var(--muted);background:#182225;border-radius:12px;padding:12px;line-height:1.5}.smallbtn{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:12px}@media(min-width:600px){main{padding:24px}.hero{padding:26px 24px}.tabs{border-radius:16px 16px 0 0}}
</style></head>
<body><div class="app">
<header class="hero"><div class="brand"><div class="logo">🚴</div><div><b>CYCLING COACH</b><div class="sub">PERSONAL TRAINING DASHBOARD</div></div></div><h1>Ride at your own pace.</h1><p>Bangun konsistensi, jaga pemulihan, nikmati setiap kayuhan.</p><div class="stats"><div class="stat"><small>Total jarak</small><strong id="total">0 <small style="display:inline">km</small></strong></div><div class="stat"><small>Aktivitas</small><strong id="rides">0</strong></div><div class="stat"><small>Sesi selesai</small><strong id="sessions">0/7</strong></div></div></header>
<main id="view"></main><nav class="tabs"><button data-tab="home" class="active"><span>⌂</span>Beranda</button><button data-tab="schedule"><span>▦</span>Jadwal</button><button data-tab="log"><span>＋</span>Catatan</button><button data-tab="recovery"><span>♡</span>Recovery</button><button data-tab="goals"><span>⚑</span>Target</button></nav>
</div>
<script>
const $=s=>document.querySelector(s);const defaultDays=[["Senin","Istirahat","Pemulihan dan peregangan ringan","Recovery"],["Selasa","Endurance","Gowes santai, jaga intensitas agar masih bisa mengobrol","30–45 menit"],["Rabu","Teknik & cadence","Latihan kayuhan halus di rute aman","30–40 menit"],["Kamis","Istirahat","Istirahat atau jalan santai jika nyaman","Recovery"],["Jumat","Endurance","Gowes santai sesuai waktu dan kondisi","30–45 menit"],["Sabtu","Gowes bebas","Pilih rute aman, idealnya bersama teman atau pendamping","40–60 menit"],["Minggu","Recovery","Pemulihan dan evaluasi kondisi tubuh","Recovery"]];
let data;try{data=JSON.parse(localStorage.getItem("cc-data"))||{done:[],logs:[],recovery:"",sleep:"",goal:50,goalName:"Endurance"}}catch(e){data={done:[],logs:[],recovery:"",sleep:"",goal:50,goalName:"Endurance"}}
let tab="home";function save(){localStorage.setItem("cc-data",JSON.stringify(data));render()}function total(){return data.logs.reduce((a,l)=>a+Number(l.distance||0),0)}function stats(){$("#total").innerHTML=total().toFixed(1)+' <small style="display:inline">km</small>';$("#rides").textContent=data.logs.length;$("#sessions").textContent=data.done.length+"/7"}
function card(title,body,extra=""){return `<section class="card"><h3>${title}</h3>${body}${extra}</section>`}
function render(){stats();document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));let v=$("#view");
if(tab==="home"){let recent=data.logs.slice(0,3).map((l,i)=>`<div class="day row"><div><b>Gowes #${data.logs.length-i}</b><div class="muted">${esc(l.duration)} · Elevasi ${esc(l.elevation||"0")} m</div></div><b>${esc(l.distance)} km</b></div>`).join("");v.innerHTML=`<h2>Ringkasan latihan</h2>${card("Fokus minggu ini",`<p>Prioritaskan konsistensi, kayuhan nyaman, dan istirahat cukup. Jadwal merupakan panduan fleksibel.</p><div class="bar"><i style="width:${data.done.length/7*100}%"></i></div><small class="muted">${data.done.length} dari 7 sesi ditandai selesai</small><button class="primary full" onclick="go('schedule')">Lihat jadwal →</button>`)}<h2>Aktivitas terakhir</h2>${card("",recent||'<div class="empty">Belum ada aktivitas. Catat gowes pertamamu.</div>','<button class="secondary full" onclick="go(\\'log\\')">Tambah aktivitas</button>')}${card("Pengingat","<p>Utamakan keselamatan, rute yang aman, hidrasi, dan dengarkan kondisi tubuh. Tidak perlu mengejar latihan yang terlewat.</p>")}`}
if(tab==="schedule"){v.innerHTML=`<h2>Jadwal mingguan</h2><p>Program awal ringan. Centang hari setelah selesai; istirahat juga bagian dari latihan.</p>${card("Rencana latihan",defaultDays.map((d,i)=>`<div class="day"><div class="row"><div><small class="muted">${d[0]}</small><div><b>${d[1]}</b></div></div><label class="row" style="font-size:12px"><input type="checkbox" style="width:auto" ${data.done.includes(d[0])?"checked":""} onchange="toggle('${d[0]}',this.checked)"> Selesai</label></div><p>${d[2]}</p><span class="pill">${d[3]}</span></div>`).join(""))}<div class="warning">Sesuaikan jadwal dengan sekolah dan kondisi tubuh. Jangan menumpuk sesi yang terlewat. Jika sakit, nyeri, pusing, atau tidak nyaman, hentikan latihan dan minta bantuan orang dewasa.</div>`}
if(tab==="log"){v.innerHTML=`<h2>Catatan aktivitas</h2><p>Masukkan data dari gowesmu atau dari Strava secara manual.</p><form id="logform" class="card"><div class="field"><label>Jarak (km)</label><input name="distance" type="number" min=".1" step=".1" required placeholder="Contoh: 20"></div><div class="field"><label>Durasi</label><input name="duration" required placeholder="Contoh: 1j 15m"></div><div class="field"><label>Kenaikan elevasi (m)</label><input name="elevation" type="number" min="0" placeholder="Contoh: 100"></div><div class="field"><label>Catatan (opsional)</label><textarea name="notes" rows="3" placeholder="Bagaimana rasanya saat gowes?"></textarea></div><button class="primary full">Simpan aktivitas</button></form><h2>Riwayat aktivitas</h2>${data.logs.map((l,i)=>card("Gowes #"+(data.logs.length-i),`<div class="row"><b>${esc(l.distance)} km</b><span class="muted">${esc(l.duration)}</span></div><p>Elevasi ${esc(l.elevation||"0")} m</p>${l.notes?`<p>${esc(l.notes)}</p>`:""}` ,`<button class="smallbtn" onclick="removeLog(${i})">Hapus</button>`)).join("")||'<div class="empty">Belum ada riwayat aktivitas.</div>'}`;$("#logform").addEventListener("submit",e=>{e.preventDefault();let f=new FormData(e.target);data.logs.unshift({distance:Number(f.get("distance")),duration:f.get("duration"),elevation:f.get("elevation")||"0",notes:f.get("notes")});save()})}
if(tab==="recovery"){v.innerHTML=`<h2>Pemulihan tubuh</h2><p>Catat kondisimu sebelum memilih aktivitas hari ini.</p>${card("Bagaimana kondisi tubuhmu?",`<div class="choices">${["Segar","Cukup bugar","Agak lelah","Sangat lelah / kurang sehat"].map(x=>`<button class="${data.recovery===x?"selected":""}" onclick="setRecovery('recovery','${x}')">${x}</button>`).join("")}</div><div class="field"><label>Kualitas tidur</label><div class="choices">${["Kurang","Cukup","Baik"].map(x=>`<button class="${data.sleep===x?"selected":""}" onclick="setRecovery('sleep','${x}')">${x}</button>`).join("")}</div></div>${data.recovery?`<div class="warning"><b>Saran:</b> ${data.recovery==="Segar"?"Jika kondisi keseluruhan mendukung, ikuti jadwal ringan.":data.recovery==="Cukup bugar"?"Pilih aktivitas ringan dan perhatikan respons tubuh.":data.recovery==="Agak lelah"?"Utamakan pemulihan; pertimbangkan istirahat.":"Istirahat dan beri tahu orang tua/wali jika merasa tidak sehat."} ${data.sleep==="Kurang"?"Usahakan tidur cukup.":""}</div>`:""}`)}<div class="warning">Jika merasakan nyeri, pusing, sesak, atau sedang sakit, hentikan latihan dan minta bantuan orang dewasa atau tenaga kesehatan.</div>`}
if(tab==="goals"){let pct=Number(data.goal)>0?Math.min(100,total()/Number(data.goal)*100):0;v.innerHTML=`<h2>Target cycling</h2><p>Target adalah panduan fleksibel, bukan kewajiban untuk memaksakan jarak.</p><section class="card"><div class="field"><label>Fokus target</label><select id="goalName"><option ${data.goalName==="Endurance"?"selected":""}>Endurance</option><option ${data.goalName==="Konsistensi"?"selected":""}>Konsistensi</option><option ${data.goalName==="Teknik"?"selected":""}>Teknik</option></select></div><div class="field"><label>Target jarak (km)</label><input id="goal" type="number" min="1" value="${Number(data.goal)||50}"></div><button class="primary full" onclick="setGoal()">Simpan target</button><div style="margin-top:18px"><small class="muted">${esc(data.goalName)}</small><h1 style="margin:3px 0">${data.goal} km</h1><p>Total tercatat: ${total().toFixed(1)} km</p><div class="bar"><i style="width:${pct}%"></i></div><small class="muted">${pct.toFixed(0)}% dari target</small></div></section>`}
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function go(t){tab=t;render()}function toggle(d,on){data.done=on?[...new Set([...data.done,d])]:data.done.filter(x=>x!==d);save()}function removeLog(i){data.logs.splice(i,1);save()}function setRecovery(k,x){data[k]=x;save()}function setGoal(){let g=Number($("#goal").value);if(g>0){data.goal=g;data.goalName=$("#goalName").value;save()}}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.tab)));render();
</script></body></html>
